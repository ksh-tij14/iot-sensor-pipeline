# Load balancer in front of the two gateway instances.
#  :8443  HTTPS, published to the LAN for the sensor boards. Rate-limited per client.
#  :8001  plain HTTP, for services inside Docker and tools on this PC only.

events {}

http {
    # Per-client limit on the LAN-facing port: a board sends one request every
    # 5 s; 5/s with a burst of 20 leaves room for retries but stops floods.
    limit_req_zone $binary_remote_addr zone=perclient:10m rate=5r/s;

    # Standard combined log, plus whether the TLS session was resumed (r) or new (.)
    # and how long the request took, so the board's send time can be explained.
    log_format timed '$remote_addr [$time_local] "$request" $status $body_bytes_sent '
                     '"$http_user_agent" tls=$ssl_session_reused rt=$request_time';
    access_log /var/log/nginx/access.log timed;
    limit_req_status 429;

    # Docker's DNS. A recreated gateway container gets a new IP; without
    # re-resolving, nginx keeps the old one and every request fails with 502.
    resolver 127.0.0.11 valid=5s ipv6=off;

    upstream gateways {
        zone gateways 64k;                 # required for "resolve" (nginx >= 1.27.3)
        # Round-robin is nginx's default. After one failed attempt an instance
        # is skipped for 10 s, then tried again.
        server gateway-1:8001 max_fails=1 fail_timeout=10s resolve;
        server gateway-2:8001 max_fails=1 fail_timeout=10s resolve;
    }

    # Shared proxy settings.
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;  # the board's real address
    # If an instance is down (refuses the connection or doesn't accept it within
    # 1 s), retry the same request on the other one. nginx only retries a POST
    # if it never reached the first instance, so a chunk can't be processed
    # twice this way (and the shared counter would reject it anyway).
    proxy_connect_timeout 1s;
    proxy_next_upstream error timeout;
    proxy_next_upstream_tries 2;
    # Longer than the gateway's own 4 s forward timeout, shorter than the
    # board's 5 s HTTP timeout.
    proxy_read_timeout 4500ms;

    server {
        listen 8443 ssl;
        ssl_certificate     /etc/nginx/certs/server.crt;
        ssl_certificate_key /etc/nginx/certs/server.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        # The ESP8266 (BearSSL, TLS 1.2) handles P-256 key exchange reliably.
        ssl_ecdh_curve      prime256v1;
        # Let the board resume TLS sessions instead of a full handshake per reading.
        ssl_session_cache   shared:TLS:1m;
        ssl_session_timeout 1h;
        ssl_session_tickets off;           # BearSSL resumes by session ID, not tickets
        client_max_body_size 4k;           # a chunk is ~400 bytes

        location / {
            limit_req zone=perclient burst=20 nodelay;
            proxy_pass http://gateways;
        }
    }

    server {
        listen 8001;
        client_max_body_size 4k;
        location / {
            proxy_pass http://gateways;
        }
    }
}
