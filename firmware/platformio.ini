; PlatformIO project for the sensor node. The same firmware builds for two boards:
;   nodemcuv2 - NodeMCU ESP8266 (ESP-12E module)   <- default
;   esp32dev  - classic ESP32 dev board (DevKitC / DOIT DevKit V1 / ESP32-WROOM-32)
; Build/upload a specific one with:  pio run -e esp32dev -t upload

[platformio]
default_envs = nodemcuv2

[env]
framework = arduino
monitor_speed = 115200
lib_deps =
    adafruit/DHT sensor library@^1.4.6
    adafruit/Adafruit Unified Sensor@^1.1.14

[env:nodemcuv2]
platform = espressif8266
board = nodemcuv2
; 160 MHz: ECDSA signing and the TLS handshake run about twice as fast
board_build.f_cpu = 160000000L
board_build.filesystem = littlefs
lib_deps =
    ${env.lib_deps}
    ; ESP32's Preferences (NVS) API, stored in flash via LittleFS
    vshymanskyy/Preferences@^2.1.0

[env:esp32dev]
platform = espressif32
board = esp32dev
