name: CI

on: push

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Unit tests
        run: |
          pip install -r requirements.txt
          python -m pytest -q

      - name: Build backend images
        run: docker compose -f docker/docker-compose.yml build

      - name: Start the stack
        run: docker compose -f docker/docker-compose.yml up -d --wait

      # Attacks 1-8 only; 9 (packet dropping) needs the physical board.
      - name: Attack simulator (attacks 1-8)
        run: docker compose -f docker/docker-compose.yml run --rm attack-simulator

      - name: Benchmark (no misses, no false positives)
        run: docker compose -f docker/docker-compose.yml run --rm attack-simulator python -m tests.benchmark --genuine 20 --runs 2

      - name: Service logs
        if: failure()
        run: docker compose -f docker/docker-compose.yml logs

      - name: Stop the stack
        if: always()
        run: docker compose -f docker/docker-compose.yml down -v
